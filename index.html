<style>
:root {
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-sidebar: #121621;
  --bg-sidebar-hover: #1e2638;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #f8fafc;
  --border-color: #e2e8f0;
  --primary: #9e1b32;
  --primary-hover: #7e1224;
  --primary-light: #fef2f4;
  --primary-tint: rgba(158, 27, 50, 0.08);
  --accent-gold: #d4af37;
  --accent-blue: #2563eb;
  --accent-green: #16a34a;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.08);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-serif: Georgia, Cambria, "Times New Roman", Times, serif;
}

[data-theme="dark"] {
  --bg-main: #0b0f17;
  --bg-card: #151c2c;
  --bg-sidebar: #090d16;
  --bg-sidebar-hover: #151d2f;
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-light: #f8fafc;
  --border-color: #232d42;
  --primary: #b82a35;
  --primary-hover: #d1323f;
  --primary-light: #2d1217;
  --primary-tint: rgba(184, 42, 53, 0.18);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.35);
  --shadow-lg: 0 10px 25px rgba(0,0,0,0.5);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  line-height: 1.5;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* Layout */
.app-layout { display: flex; min-height: 100vh; }

/* Sidebar */
aside {
  width: 280px;
  background: var(--bg-sidebar);
  color: #e2e8f0;
  display: flex;
  flex-direction: column;
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  border-right: 1px solid rgba(255, 255, 255, 0.05);
}

.brand-header {
  padding: 20px 18px;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 12px;
  text-decoration: none;
  color: #fff;
}

.brand-crest {
  width: 40px;
  height: 40px;
  background: linear-gradient(135deg, var(--primary), var(--accent-gold));
  border-radius: 10px;
  display: grid;
  place-items: center;
  font-family: var(--font-serif);
  font-weight: 700;
  color: #fff;
  font-size: 1.2rem;
  box-shadow: 0 2px 8px rgba(158, 27, 50, 0.4);
}

.brand-text b { display: block; font-family: var(--font-serif); font-size: 0.95rem; letter-spacing: 0.5px; }
.brand-text small { font-size: 0.65rem; color: #94a3b8; display: block; text-transform: uppercase; letter-spacing: 0.5px; }

.close-btn {
  display: none;
  background: transparent;
  border: none;
  color: #94a3b8;
  font-size: 1.4rem;
  cursor: pointer;
  padding: 4px;
}

.nav-section { padding: 16px 12px; flex: 1; overflow-y: auto; }
.nav-caption {
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: #64748b;
  margin: 12px 10px 8px;
}

nav button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: transparent;
  border: none;
  border-radius: var(--radius-sm);
  color: #94a3b8;
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s ease;
  margin-bottom: 2px;
  text-align: left;
}

nav button:hover { background: var(--bg-sidebar-hover); color: #f8fafc; }
nav button.active {
  background: var(--primary);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(158, 27, 50, 0.3);
}

nav button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.user-sidebar-card {
  padding: 14px;
  margin: 12px;
  background: rgba(255,255,255,0.04);
  border-radius: var(--radius-md);
  border: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 12px;
}

.user-avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #d1323f);
  color: #fff;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 1rem;
  flex-shrink: 0;
}

.user-info b { display: block; font-size: 0.88rem; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.user-info span { font-size: 0.75rem; color: #94a3b8; }

/* Main Content */
main {
  flex: 1;
  margin-left: 280px;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

header {
  height: 64px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border-color);
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(8px);
}

.header-left { display: flex; align-items: center; gap: 14px; flex: 1; }
.menu-btn {
  display: none;
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  align-items: center;
  justify-content: center;
}

.select-student-wrapper { position: relative; max-width: 320px; width: 100%; }
.select-student-wrapper select {
  width: 100%;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  color: var(--text-main);
  font-size: 0.88rem;
  font-weight: 500;
  cursor: pointer;
  outline: none;
}

.header-actions { display: flex; align-items: center; gap: 10px; }
.icon-btn {
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  width: 38px;
  height: 38px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background 0.15s;
}
.icon-btn:hover { background: var(--border-color); }
.icon-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }

/* Page View Container */
.container { padding: 24px; max-width: 1100px; margin: 0 auto; width: 100%; }

/* Banner / Hero */
.hero-card {
  background: linear-gradient(135deg, #1e090c 0%, #3d1017 50%, #151c2c 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  box-shadow: var(--shadow-md);
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.hero-card::after {
  content: "AU";
  position: absolute;
  right: -20px;
  bottom: -30px;
  font-size: 10rem;
  font-family: var(--font-serif);
  font-weight: 900;
  color: rgba(255,255,255,0.03);
  pointer-events: none;
}

.hero-main { display: flex; align-items: center; gap: 20px; z-index: 1; }
.hero-avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: var(--primary);
  border: 3px solid rgba(255,255,255,0.2);
  color: #fff;
  display: grid;
  place-items: center;
  font-size: 1.8rem;
  font-weight: 700;
  box-shadow: var(--shadow-md);
}

.hero-details h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 4px; font-family: var(--font-serif); }
.hero-details p { color: #cbd5e1; font-size: 0.92rem; }
.hero-details .badge {
  display: inline-block;
  margin-top: 8px;
  background: rgba(212, 175, 55, 0.2);
  color: var(--accent-gold);
  border: 1px solid rgba(212, 175, 55, 0.4);
  padding: 3px 10px;
  border-radius: 99px;
  font-size: 0.75rem;
  font-weight: 600;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
  border: none;
  padding: 10px 18px;
  border-radius: var(--radius-sm);
  font-size: 0.88rem;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s;
  z-index: 1;
}
.btn-primary:hover { background: var(--primary-hover); }

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}

.stat-icon {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--primary-tint);
  color: var(--primary);
  display: grid;
  place-items: center;
  flex-shrink: 0;
}
.stat-icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }

.stat-label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-value { font-size: 1.6rem; font-weight: 700; color: var(--text-main); line-height: 1.2; }
.stat-subtext { font-size: 0.78rem; color: var(--text-muted); }

/* Card Content */
.card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border-color);
}

.card-title { font-size: 1.1rem; font-weight: 700; color: var(--text-main); }
.card-subtitle { font-size: 0.85rem; color: var(--text-muted); }

/* Data Tables & Key Value Rows */
.data-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border-color);
  font-size: 0.9rem;
}
.data-row:last-child { border-bottom: none; }
.data-label { color: var(--text-muted); font-weight: 500; }
.data-value { font-weight: 600; text-align: right; color: var(--text-main); }

/* Progress Bar */
.progress-container { margin: 12px 0; }
.progress-bar {
  height: 10px;
  background: var(--border-color);
  border-radius: 99px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent-gold));
  border-radius: 99px;
  transition: width 0.4s ease;
}

/* Chips & Badges */
.chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  background: var(--primary-tint);
  color: var(--primary);
  border: 1px solid rgba(158, 27, 50, 0.15);
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 0.82rem;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip button {
  background: transparent;
  border: none;
  color: currentColor;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
}

/* Item Lists */
.list-item {
  padding: 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-main);
  border: 1px solid var(--border-color);
  margin-bottom: 10px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.list-item-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
.list-item-desc { font-size: 0.85rem; color: var(--text-muted); }
.list-item-tag { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; background: var(--border-color); color: var(--text-muted); font-weight: 600; }

/* Forms & Inputs */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.form-control {
  width: 100%;
  padding: 10px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-color);
  background: var(--bg-main);
  color: var(--text-main);
  font: inherit;
  font-size: 0.9rem;
  outline: none;
}
.form-control:focus { border-color: var(--primary); }

/* Grid Layouts */
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }

/* Timetable Grid */
.timetable { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
.timetable th, .timetable td { border: 1px solid var(--border-color); padding: 10px; text-align: left; }
.timetable th { background: var(--bg-main); font-weight: 600; color: var(--text-muted); }
.timetable-event { background: var(--primary-tint); border-left: 3px solid var(--primary); padding: 6px 8px; border-radius: 4px; }

/* Scrim */
#scrim {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(2px);
  z-index: 25;
}

/* Responsive */
@media (max-width: 820px) {
  aside { transform: translateX(-100%); width: 280px; }
  body.menu-open aside { transform: translateX(0); }
  body.menu-open #scrim { display: block; }
  main { margin-left: 0; }
  .menu-btn, .close-btn { display: flex; }
  .hero-card { flex-direction: column; align-items: flex-start; }
  .hero-card .btn-primary { width: 100%; justify-content: center; }
}

@media print {
  aside, header, #scrim, .btn-primary, .icon-btn, .no-print { display: none !important; }
  main { margin-left: 0 !important; }
  body { background: #fff !important; color: #000 !important; }
  .card { border: 1px solid #ccc !important; box-shadow: none !important; }
}
</style>

// Helper DOM Functions
function $(id) { return document.getElementById(id); }
function escapeHtml(str) {
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Initialize Select Options
function initStudentSelect() {
  var select = $("studentSelect");
  select.innerHTML = "";
  STUDENTS.forEach(function(s, idx) {
    var opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = s.name + " (" + s.id + ")";
    select.appendChild(opt);
  });
  select.value = currentStudentIdx;
  select.onchange = function() {
    currentStudentIdx = parseInt(this.value, 10);
    render();
  };
}

// Render Navigation
function renderNav() {
  var nav = $("navMenu");
  nav.innerHTML = "";
  NAV_ITEMS.forEach(function(item) {
    var btn = document.createElement("button");
    btn.className = (item.id === currentView) ? "active" : "";
    btn.innerHTML = item.icon + '<span>' + item.name + '</span>';
    btn.onclick = function() {
      currentView = item.id;
      document.body.classList.remove("menu-open");
      render();
      window.scrollTo(0, 0);
    };
    nav.appendChild(btn);
  });
}

// Action Functions
function addSkill() {
  var input = $("newSkillInput");
  var val = input.value.trim();
  if(!val) return;
  var s = STUDENTS[currentStudentIdx];
  var sk = userSkills[s.id] || s.skills.slice();
  sk.push(val);
  userSkills[s.id] = sk;
  saveSkills();
  render();
}

function removeSkill(idx) {
  var s = STUDENTS[currentStudentIdx];
  var sk = userSkills[s.id] || s.skills.slice();
  sk.splice(idx, 1);
  userSkills[s.id] = sk;
  saveSkills();
  render();
}

function addAchievement() {
  var title = $("achTitle").value.trim();
  var detail = $("achDetail").value.trim();
  var date = $("achDate").value;
  var cat = $("achCat").value;
  if(!title) return;

  var s = STUDENTS[currentStudentIdx];
  var list = userAchievements[s.id] || s.defaultAchievements || [];
  list.push({ title: title, detail: detail, date: date, category: cat });
  userAchievements[s.id] = list;
  saveAchievements();
  render();
}

function removeAchievement(idx) {
  var s = STUDENTS[currentStudentIdx];
  var list = userAchievements[s.id] || s.defaultAchievements || [];
  list.splice(idx, 1);
  userAchievements[s.id] = list;
  saveAchievements();
  render();
}

function calculateGPA() {
  var s = STUDENTS[currentStudentIdx];
  var addGrade = parseFloat($("simGrade").value);
  var addCredits = parseInt($("simCredits").value, 10);
  
  var currentPoints = s.gpa * s.completedCredits;
  var newTotalCredits = s.completedCredits + addCredits;
  var newTotalPoints = currentPoints + (addGrade * addCredits);
  var proj = newTotalPoints / newTotalCredits;

  $("projectedGpa").textContent = proj.toFixed(2);
}

// Mobile Sidebar Toggles

$("closeSidebar").onclick = $("scrim").onclick = function() { document.body.classList.remove("menu-open"); };

// Theme Toggle Engine
var themeToggleBtn = $("themeToggle");
var currentTheme = localStorage.getItem("au_theme") || "system";

function applyTheme(theme) {
  if (theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.setAttribute("data-theme", "light");
  }
}

themeToggleBtn.onclick = function() {
  var isDark = document.documentElement.getAttribute("data-theme") === "dark";
  var newTheme = isDark ? "light" : "dark";
  localStorage.setItem("au_theme", newTheme);
  applyTheme(newTheme);
};
